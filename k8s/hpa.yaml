apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: devshop-hpa
  namespace: devshop
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: devshop
  minReplicas: 2
  maxReplicas: 5
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 30
    scaleDown:
      stabilizationWindowSeconds: 60
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70