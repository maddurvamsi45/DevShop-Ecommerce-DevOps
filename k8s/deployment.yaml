apiVersion: apps/v1
kind: Deployment
metadata:
  name: devshop
  namespace: devshop
  labels:
    app: devshop
spec:
  replicas: 2
  selector:
    matchLabels:
      app: devshop
  template:
    metadata:
      labels:
        app: devshop
    spec:
      containers:
        - name: devshop
          image: madduruvamsi/devshop-ecommerce:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 20
